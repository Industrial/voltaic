# Shared input defaults (nixpkgs, rust-overlay, git-hooks, nixpkgs-python, …)
# live in `nix/devenv-modules/devenv.yaml`. Project-only pins stay here.
imports:
  - ./nix/devenv-modules
# claude-code is unfree; permit it explicitly (local.features.program-claude-code).
nixpkgs:
  permittedUnfreePackages:
    - claude-code
