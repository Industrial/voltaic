[package]
name = "voltaic-lattice"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Lattice: the inference engine for the Voltaic compiler — types, effect rows, ownership modes and refinements."

# `src/` is generated from `vlt/` and is `.gitignore`d, so cargo's git file
# listing packages no Rust at all and the published crate is an empty shell.
# An `include` switches cargo to a filesystem walk, which does pick the
# generated tree up. See `docs/RELEASING.md`.
include = ["src/**/*.rs", "vlt/**/*.vlt", "Cargo.toml"]

[dependencies]
voltaic-ast.workspace = true
voltaic-diag.workspace = true

# The parser is a *dev* dependency. Leaf 5's corpus needs real programs, and a
# runtime dependency would be the wrong direction: the parser does not know about
# Lattice, and Lattice does not parse.
#
# Path only, no version — the opposite of the runtime dependencies above.
# `cargo publish` resolves a dev-dependency's version against crates.io even when
# it also carries a path, so a versioned dev-dep makes this crate's publish wait
# for a sibling it does not need in order to build. `publish_metadata.rs` asserts
# it.
[dev-dependencies]
voltaic-parser = { path = "../voltaic-parser" }

# The five surface-fact allows — see the root manifest.
[lints]
workspace = true
